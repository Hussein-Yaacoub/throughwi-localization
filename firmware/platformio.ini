; PlatformIO config for ESP32 CSI Data Collection Tool v2.0
; Board: ESP32 DevKit (change if yours differs)

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Enable the lwIP ping component (needed for active CSI triggering)
build_flags =
    -D CONFIG_LWIP_ICMP=1
    -D CONFIG_ESP32_WIFI_CSI_ENABLED=1

; Increase serial buffer for high-throughput CSI streaming
monitor_filters = direct
